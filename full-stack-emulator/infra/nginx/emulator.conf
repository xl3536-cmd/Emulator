# =============================================================================
# Full Stack Emulator — nginx site
# =============================================================================
# Installed to /etc/nginx/sites-available/emulator and symlinked into
# sites-enabled by install-emulator-service.sh.
#
# Three literal values must agree with infra/emulator.env:
#   listen 80            <-> (nginx port; fixed here)
#   root /var/www/emulator <-> FRONTEND_DEST
#   proxy_pass :8000     <-> BACKEND_PORT
# install-emulator-service.sh compares them and refuses to install on mismatch.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/emulator;
    index index.html;

    # The emulator UI pushes whole config documents (all RTD sensors, valves,
    # Arctic HP register maps) in one PUT. The default 1m is enough today but
    # leaves no headroom as board counts grow.
    client_max_body_size 8m;

    access_log /var/log/nginx/emulator.access.log;
    error_log  /var/log/nginx/emulator.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # --- React SPA -----------------------------------------------------------
    # Client-side routing: any path that is not a real file falls back to
    # index.html so a deep link / hard refresh does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets/, so they are immutable.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a redeploy leaves browsers pointed at
    # asset hashes that no longer exist (blank page, 404s in the console).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # --- API proxy -----------------------------------------------------------
    # Every backend route is mounted under /api/ (see backend/app.py routers),
    # so this single location covers the whole API surface.
    location /api/ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive to the backend: HTTP/1.1 with the hop-by-hop Connection
        # header cleared.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Generous read timeout. Arctic HP server start/stop and RTD CSV loads
        # do real serial and file work inside the request.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    180s;

        # Emulator state is live hardware state — never serve it from cache.
        proxy_buffering off;
    }

    # --- Health probes -------------------------------------------------------
    # /nginx-health proves nginx is up. /backend-health proves the proxy chain
    # AND uvicorn are up: it maps to the backend's own "/" route, which returns
    # {"message": "Full Stack Emulator", "status": "running", ...}.
    # The backend has no dedicated /health endpoint; this is the substitute.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    location = /backend-health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }
}
